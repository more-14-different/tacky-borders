name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit, branch, or tag to build"
        required: false
        default: "HEAD"
      release_tag:
        description: "Existing tag to publish/update; leave empty for build-only runs"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out workflow-dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BUILD_TARGET: ${{ inputs.commit_sha }}
        run: git checkout --detach $env:BUILD_TARGET

      - name: Build
        run: cargo build --release

      - name: Get commit SHA of current build
        id: commit
        run: |
          $sha = git rev-parse HEAD
          "COMMIT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tacky-borders-${{ env.COMMIT_SHA }}
          path: target/release/*.exe
          retention-days: 30

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out workflow-dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BUILD_TARGET: ${{ inputs.commit_sha }}
        run: git checkout --detach $env:BUILD_TARGET

      - name: Run tests
        run: cargo test --verbose

  release:
    needs: [build, test]
    runs-on: windows-latest
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: tacky-borders-${{ needs.build.outputs.commit_sha }}
          path: ./artifacts/

      - name: Compress artifacts
        run: |
          $compress = @{
            Path = "./artifacts/tacky-borders.exe"
            DestinationPath = "./artifacts/tacky-borders-$env:RELEASE_TAG.zip"
          }
          Compress-Archive @compress
          Remove-Item -Path "./artifacts/tacky-borders.exe"

      - name: Generate checksums
        run: |
          cd ./artifacts
          sha256sum * > sha256sums.txt
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: false
          body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
          files: ./artifacts/*
